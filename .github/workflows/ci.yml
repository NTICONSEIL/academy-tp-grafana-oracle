name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── Lint & validation syntaxique ──────────────────────────────────────────
  lint:
    name: Lint & syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install flake8 pylint

      - name: Flake8 (bridge)
        run: flake8 bridge/app.py --max-line-length=120 --ignore=E501,W503

      - name: Validate docker-compose syntax
        run: docker compose config --quiet

      - name: Validate JSON dashboard
        run: python3 -c "import json,sys; json.load(open('grafana/dashboards/banc_test.json')); print('Dashboard JSON OK')"

      - name: Validate YAML provisioning
        run: |
          python3 -c "
          import yaml, glob, sys
          files = glob.glob('grafana/provisioning/**/*.yaml', recursive=True)
          for f in files:
              yaml.safe_load(open(f))
              print(f'OK: {f}')
          "

  # ── Build de l'image bridge ────────────────────────────────────────────────
  build-bridge:
    name: Build bridge Docker image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build bridge image
        run: docker build -t tp-bridge:ci ./bridge

      - name: Smoke test — module import
        run: |
          docker run --rm \
            -e ORACLE_HOST=placeholder \
            -e ORACLE_USER=placeholder \
            -e ORACLE_PASSWORD=placeholder \
            tp-bridge:ci \
            python3 -c "import flask, oracledb, waitress; print('Imports OK')"

  # ── Vérification de sécurité basique ──────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      - name: Bandit security scan (bridge)
        run: bandit bridge/app.py -ll -x B104

      - name: Check .env not committed
        run: |
          if git ls-files | grep -q '^\.env$'; then
            echo "ERREUR : le fichier .env est committé (contient des secrets) !"
            exit 1
          fi
          echo ".env absent du dépôt : OK"

      - name: Check no hardcoded passwords
        run: |
          if grep -rn "changeme\|password123\|secret123" bridge/ oracle/ --include="*.py" --include="*.sql"; then
            echo "AVERTISSEMENT : mots de passe par défaut détectés dans les sources"
          fi
          echo "Scan mots de passe OK"
