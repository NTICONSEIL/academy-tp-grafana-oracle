name: CD — Publish bridge image

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/bridge

jobs:
  publish:
    name: Build & push bridge image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push bridge image
        uses: docker/build-push-action@v5
        with:
          context: ./bridge
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release note
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## TP Grafana — Banc de Test Oracle 23ai ${{ github.ref_name }}

            ### Image Docker bridge
            ```
            docker pull ghcr.io/${{ github.repository }}/bridge:${{ github.ref_name }}
            ```

            ### Démarrage rapide
            ```bash
            cp .env.example .env   # adapter les mots de passe
            docker compose up -d
            ```
